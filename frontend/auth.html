<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign In - YouTube Clone</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-box">
    <div style="text-align:center;font-size:36px;margin-bottom:16px">▶</div>
    <h1 id="auth-title">Sign In</h1>
    <p class="subtitle" id="auth-subtitle">Welcome back</p>

    <form id="auth-form" onsubmit="handleSubmit(event)">
      <div class="form-group" id="username-group" style="display:none">
        <label>Username</label>
        <input type="text" id="username" placeholder="username" autocomplete="username">
      </div>
      <div class="form-group">
        <label>Email or Username</label>
        <input type="text" id="login" placeholder="email or username" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <div id="error-msg" class="error-msg" style="display:none"></div>
      <button type="submit" class="form-submit" id="submit-btn">Sign In</button>
    </form>

    <div class="auth-switch">
      <span id="switch-text">Don't have an account?</span>
      <a href="#" id="switch-link" onclick="toggleMode()">Create account</a>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
// Redirect if already logged in
if (API.isLoggedIn()) location.href = '/';

let isRegister = false;

function toggleMode() {
  isRegister = !isRegister;
  document.getElementById('auth-title').textContent = isRegister ? 'Create Account' : 'Sign In';
  document.getElementById('auth-subtitle').textContent = isRegister ? 'Join the platform' : 'Welcome back';
  document.getElementById('submit-btn').textContent = isRegister ? 'Create Account' : 'Sign In';
  document.getElementById('switch-text').textContent = isRegister ? 'Already have an account?' : "Don't have an account?";
  document.getElementById('switch-link').textContent = isRegister ? 'Sign In' : 'Create account';
  document.getElementById('username-group').style.display = isRegister ? 'block' : 'none';
  document.getElementById('login').labels[0].textContent = isRegister ? 'Email' : 'Email or Username';
  document.getElementById('error-msg').style.display = 'none';
}

async function handleSubmit(e) {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const errEl = document.getElementById('error-msg');
  errEl.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Loading...';

  try {
    let data;
    if (isRegister) {
      await API.request('POST', '/auth/register', {
        email: document.getElementById('login').value,
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
      });
      // Auto login after register
      data = await API.request('POST', '/auth/login', {
        login: document.getElementById('login').value,
        password: document.getElementById('password').value,
      });
    } else {
      data = await API.request('POST', '/auth/login', {
        login: document.getElementById('login').value,
        password: document.getElementById('password').value,
      });
    }

    if (data) {
      API.saveTokens(data);
      const redirectTo = new URLSearchParams(location.search).get('next') || '/';
      location.href = redirectTo;
    }
  } catch(err) {
    errEl.textContent = err.message;
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = isRegister ? 'Create Account' : 'Sign In';
  }
}
</script>
</body>
</html>
