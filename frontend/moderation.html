<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moderation Panel - YouTube Clone</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<nav class="navbar">
  <a href="/" class="logo">▶ <span>Tube</span> <span style="font-size:12px;color:var(--accent);margin-left:8px;border:1px solid var(--accent);padding:2px 6px;border-radius:4px">MOD</span></a>
  <div class="nav-actions" id="nav-actions">
    <a href="/" class="btn-nav">To Main</a>
    <button class="btn-nav" onclick="API.logout()">Logout</button>
  </div>
</nav>

<div class="page">
  <div class="container mod-wrap">
    <h1>Content Moderation</h1>
    
    <div class="mod-tabs">
      <button class="mod-tab active" onclick="switchTab('pending', this)">Pending (<span id="count-pending">0</span>)</button>
      <button class="mod-tab" onclick="switchTab('resolved', this)">Resolved</button>
      <button class="mod-tab" onclick="switchTab('dismissed', this)">Dismissed</button>
    </div>

    <div id="reports-container">
      <div class="spinner"></div>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
if (!API.isLoggedIn() || !API.isModerator()) {
  location.href = '/auth.html?next=/moderation.html';
}

let currentFilter = 'pending';

async function init() {
  await loadReports();
}

function switchTab(status, btn) {
  document.querySelectorAll('.mod-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentFilter = status;
  loadReports();
}

async function loadReports() {
  const container = document.getElementById('reports-container');
  container.innerHTML = '<div class="spinner"></div>';
  try {
    const reports = await API.request('GET', `/moderation/reports?status_filter=${currentFilter}`);
    if (currentFilter === 'pending') {
      document.getElementById('count-pending').textContent = reports ? reports.length : 0;
    }
    
    if (!reports || reports.length === 0) {
      container.innerHTML = `<p style="color:var(--text2);text-align:center;padding:40px">No ${currentFilter} reports found.</p>`;
      return;
    }

    container.innerHTML = reports.map(r => `
      <div class="report-card" id="report-${r.id}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div>
            <div class="r-title">
              Video: <a href="/watch.html?id=${r.video_id}" target="_blank" style="color:#1a73e8;text-decoration:underline">
                ${r.video_title ? escHtml(r.video_title) : `Video #${r.video_id}`}
              </a>
            </div>
            <div class="r-meta">
              Reported by <strong>${escHtml(r.reporter_username || 'Unknown')}</strong> · 
              Reason: <span style="color:var(--accent);font-weight:600">${r.reason.toUpperCase()}</span> · 
              ${Utils.fmtDate(r.created_at)}
            </div>
            ${r.description ? `<p style="font-size:14px;background:var(--bg3);padding:8px 12px;border-radius:6px;margin-bottom:12px">"${escHtml(r.description)}"</p>` : ''}
          </div>
          <div>
            <span style="font-size:12px;padding:4px 8px;border-radius:4px;background:${r.status === 'pending' ? '#e65100' : r.status === 'resolved' ? '#2e7d32' : '#555'}">
              ${r.status.toUpperCase()}
            </span>
          </div>
        </div>

        ${r.status === 'pending' ? `
          <div class="report-actions" style="margin-top:10px">
            <button class="btn-sm btn-warn" onclick="resolveReport(${r.id}, 'hide')">Hide Video</button>
            <button class="btn-sm btn-dismiss" onclick="resolveReport(${r.id}, 'dismiss')">Dismiss</button>
            ${API.isAdmin() ? `
              <button class="btn-sm btn-danger" onclick="resolveReport(${r.id}, 'delete')">Delete Permanently</button>
            ` : ''}
          </div>
        ` : `
          <div style="font-size:12px;color:var(--text2);margin-top:8px">
            Handled by ${r.moderator_username || 'Admin'} at ${Utils.fmtDate(r.resolved_at)}
            ${r.moderator_notes ? `— <em>${escHtml(r.moderator_notes)}</em>` : ''}
          </div>
        `}
      </div>
    `).join('');
  } catch(e) {
    container.innerHTML = `<p style="color:var(--text2);padding:40px">${e.message}</p>`;
  }
}

async function resolveReport(reportId, action) {
  const notes = prompt(`Action: ${action.toUpperCase()}. Add moderation notes (optional):`) || '';
  try {
    await API.request('POST', `/moderation/reports/${reportId}/resolve`, {
      action: action,
      moderator_notes: notes
    });
    Utils.showToast(`Report resolved (${action})`, 'success');
    loadReports();
  } catch(e) {
    Utils.showToast(e.message, 'error');
  }
}

init();
</script>
</body>
</html>
