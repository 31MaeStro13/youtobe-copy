<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Search - YouTube Clone</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<nav class="navbar">
  <a href="/" class="logo">▶ <span>Tube</span></a>
  <div class="search-bar">
    <input id="search-input" type="text" placeholder="Search videos..." onkeydown="if(event.key==='Enter')doSearch()">
    <button onclick="doSearch()">🔍</button>
  </div>
  <div class="nav-actions" id="nav-actions"></div>
</nav>

<div class="page">
  <div class="container" style="max-width: 1000px;">
    <h2 id="search-heading" style="margin-bottom: 20px; font-weight: 500; font-size: 18px; color: var(--text2);">Results for query</h2>
    <div id="results-list" class="search-results-list">
      <div class="spinner"></div>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
const params = new URLSearchParams(location.search);
const query = params.get('q') || '';

async function init() {
  renderNavbar();
  document.getElementById('search-input').value = query;
  if (!query) {
    document.getElementById('results-list').innerHTML = '<p style="color:var(--text2);padding:40px">Please enter a search query.</p>';
    return;
  }
  document.getElementById('search-heading').textContent = `Results for "${escHtml(query)}"`;
  await performSearch();
}

function renderNavbar() {
  const el = document.getElementById('nav-actions');
  if (API.isLoggedIn()) {
    const u = API.getCurrentUser();
    el.innerHTML = `
      <a href="/upload.html" class="btn-nav btn-primary">+ Upload</a>
      <a href="/channel.html" id="my-channel-link" class="btn-nav">📺 My Channel</a>
      ${API.isModerator() ? '<a href="/moderation.html" class="btn-nav">🛡 Mod</a>' : ''}
      <div class="avatar-btn" title="${u.username}">${u.username[0].toUpperCase()}</div>
      <button class="btn-nav" onclick="API.logout()">Logout</button>
    `;
    API.request('GET', '/channels/my').then(channels => {
      const link = document.getElementById('my-channel-link');
      if (link && channels && channels.length > 0) {
        link.href = `/channel.html?id=${channels[0].id}`;
      }
    });
  } else {
    el.innerHTML = `<a href="/auth.html" class="btn-nav btn-primary">Sign In</a>`;
  }
}

async function performSearch() {
  const container = document.getElementById('results-list');
  try {
    const videos = await API.request('GET', `/videos/?search=${encodeURIComponent(query)}`);
    if (!videos || videos.length === 0) {
      container.innerHTML = '<p style="color:var(--text2);padding:40px;text-align:center">No videos matching your query.</p>';
      return;
    }
    container.innerHTML = videos.map(v => `
      <div class="search-item" onclick="location.href='/watch.html?id=${v.id}'">
        <div class="s-thumb">
          ${v.thumbnail_url ? `<img src="${v.thumbnail_url}" alt="${escHtml(v.title)}" loading="lazy">` : '<div style="width:100%;height:100%;background:var(--bg3)"></div>'}
          <span class="duration">${Utils.fmtDuration(v.duration_seconds)}</span>
        </div>
        <div class="s-info">
          <h3>${escHtml(v.title)}</h3>
          <div class="sub">${escHtml(v.channel_title)} · ${Utils.fmtViews(v.views_count)} views · ${Utils.fmtDate(v.created_at)}</div>
        </div>
      </div>
    `).join('');
  } catch(e) {
    container.innerHTML = `<p style="color:var(--text2);padding:40px">${e.message}</p>`;
  }
}

function doSearch() {
  const q = document.getElementById('search-input').value.trim();
  if (q) location.href = `/search.html?q=${encodeURIComponent(q)}`;
}

init();
</script>
</body>
</html>
